<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMPULSE FILE WORLD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      position: fixed;
      top: 0; left: 0;
    }

    /* ─── LOCK SCREEN ───────────────────────────────────────── */
    #lock-screen {
      position: fixed; inset: 0;
      background: #080810;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 500; cursor: pointer;
    }
    #lock-screen h1 {
      color: #fff; font-size: 36px;
      letter-spacing: 10px; text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(100,150,255,0.8);
    }
    #lock-screen .sub {
      color: #4466ff; font-size: 12px; letter-spacing: 4px;
      margin-bottom: 40px;
    }
    #lock-screen .click-prompt {
      color: #aaa; font-size: 14px; letter-spacing: 6px;
      animation: blink 1.6s ease-in-out infinite;
    }
    #lock-screen .instructions {
      position: absolute; bottom: 40px;
      color: #444; font-size: 11px; letter-spacing: 3px;
      line-height: 2; text-align: center;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ─── FADE OVERLAY ──────────────────────────────────────── */
    #fade {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0);
      pointer-events: none;
      z-index: 400;
      transition: background 0.4s ease;
    }
    #fade.black { background: rgba(0,0,0,1); }

    /* ─── HUD ───────────────────────────────────────────────── */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 10;
    }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 20px; height: 20px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute;
      background: rgba(255,255,255,0.9);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { height: 2px; width: 100%; top: 50%;  transform: translateY(-50%); }
    #crosshair.dot::before, #crosshair.dot::after { display: none; }
    #crosshair.dot::before {
      display: block; width: 4px; height: 4px;
      border-radius: 50%; left: 50%; top: 50%;
      transform: translate(-50%,-50%);
    }

    /* Room label */
    #room-label {
      position: absolute; top: 18px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 11px; letter-spacing: 6px; text-transform: uppercase;
    }

    /* Interact prompt */
    #interact-prompt {
      position: absolute; bottom: 32%; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff; padding: 7px 18px;
      font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.3);
      display: none;
      white-space: nowrap;
    }

    /* Portal label */
    #portal-label {
      position: absolute; bottom: 38%; left: 50%;
      transform: translateX(-50%);
      color: #ffcc44; font-size: 11px;
      letter-spacing: 4px; text-transform: uppercase;
      display: none;
      text-shadow: 0 0 10px #ffcc44;
    }

    /* Controls hint */
    #controls-hint {
      position: absolute; bottom: 20px; left: 20px;
      color: rgba(255,255,255,0.3);
      font-size: 10px; letter-spacing: 2px; line-height: 2;
    }

    /* ─── CABINET UI ─────────────────────────────────────────── */
    #cabinet-ui {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #111118;
      border: 1px solid #33334a;
      padding: 0;
      min-width: 420px; max-width: 500px;
      max-height: 65vh;
      display: none; flex-direction: column;
      z-index: 300;
      box-shadow: 0 0 40px rgba(0,0,100,0.5);
    }
    #cabinet-ui.open { display: flex; }

    .cabinet-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #222233;
      background: #0d0d1a;
    }
    .cabinet-header h2 {
      color: #ffcc44; font-size: 12px;
      letter-spacing: 4px; text-transform: uppercase;
    }
    .cabinet-header .cat-badge {
      font-size: 10px; color: #666;
      letter-spacing: 2px;
    }
    #cabinet-close {
      color: #555; cursor: pointer; font-size: 18px;
      padding: 2px 6px; pointer-events: all;
    }
    #cabinet-close:hover { color: #fff; }

    #cabinet-file-list {
      overflow-y: auto; flex: 1;
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: #333 #111;
    }

    .file-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 10px; margin-bottom: 3px;
      background: #181824; cursor: pointer;
      color: #bbb; font-size: 11px; letter-spacing: 1px;
      pointer-events: all;
      border-left: 3px solid transparent;
      transition: border-color 0.1s, background 0.1s;
    }
    .file-item:hover { background: #222234; color: #fff; border-left-color: #4466ff; }
    .file-item .icon { font-size: 16px; flex-shrink: 0; }
    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .size { color: #444; font-size: 9px; flex-shrink: 0; }

    .empty-msg {
      text-align: center; color: #333;
      padding: 30px 20px; font-size: 11px; letter-spacing: 3px;
      line-height: 2;
    }

    .cabinet-footer {
      padding: 12px 10px;
      border-top: 1px solid #222233;
      background: #0d0d1a;
      pointer-events: all;
    }
    #upload-btn {
      width: 100%; padding: 10px;
      background: transparent;
      color: #4466ff; border: 1px solid #4466ff;
      cursor: pointer; font-family: inherit;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      pointer-events: all;
      transition: background 0.15s, color 0.15s;
    }
    #upload-btn:hover { background: #4466ff; color: #fff; }

    /* ─── FILE VIEWER ────────────────────────────────────────── */
    #file-viewer {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.93);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 350;
    }
    #file-viewer.open { display: flex; }
    #viewer-close {
      position: absolute; top: 20px; right: 24px;
      color: #555; font-size: 22px; cursor: pointer;
      padding: 6px 12px;
      border: 1px solid #222;
      pointer-events: all;
    }
    #viewer-close:hover { color: #fff; border-color: #444; }
    #viewer-content {
      max-width: 90vw; max-height: 80vh;
      display: flex; align-items: center; justify-content: center;
    }
    #viewer-content img { max-width: 100%; max-height: 80vh; object-fit: contain; }
    #viewer-content video { max-width: 100%; max-height: 80vh; outline: none; }
    #viewer-content audio { width: 400px; }
    #viewer-content .doc-preview {
      color: #ccc; font-size: 13px; letter-spacing: 1px;
      padding: 40px; text-align: center; line-height: 2;
    }
    #viewer-content .doc-preview a {
      color: #4466ff; text-decoration: none;
      border-bottom: 1px solid #4466ff;
    }
    #viewer-name {
      margin-top: 14px; color: rgba(255,255,255,0.5);
      font-size: 11px; letter-spacing: 3px;
      max-width: 80vw; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    /* ─── ROOM TRANSITION TAG ────────────────────────────────── */
    #room-enter {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-size: 22px;
      letter-spacing: 8px; text-transform: uppercase;
      display: none;
      text-shadow: 0 0 20px #fff;
      animation: blink 0.8s infinite;
    }
  </style>
</head>
<body>

<!-- Lock screen -->
<div id="lock-screen">
  <h1>IMPULSE FILE WORLD</h1>
  <div class="sub">3D PIXEL FILE STORAGE</div>
  <div class="click-prompt">[ CLICK TO ENTER ]</div>
  <div class="instructions">
    WASD — MOVE &nbsp;|&nbsp; MOUSE — LOOK<br>
    E — INTERACT &nbsp;|&nbsp; ESC — PAUSE
  </div>
</div>

<!-- Fade overlay -->
<div id="fade"></div>

<!-- HUD -->
<div id="hud">
  <div id="crosshair"></div>
  <div id="room-label">HUB</div>
  <div id="interact-prompt"></div>
  <div id="portal-label"></div>
  <div id="room-enter"></div>
  <div id="controls-hint">
    WASD — MOVE<br>
    MOUSE — LOOK<br>
    E — INTERACT<br>
    ESC — RELEASE MOUSE
  </div>
</div>

<!-- Cabinet UI -->
<div id="cabinet-ui">
  <div class="cabinet-header">
    <h2>FILING CABINET</h2>
    <span class="cat-badge" id="cabinet-cat">ALL FILES</span>
    <span id="cabinet-close">[X]</span>
  </div>
  <div id="cabinet-file-list"></div>
  <div class="cabinet-footer">
    <input type="file" id="file-input" multiple style="display:none" />
    <button id="upload-btn">+ ADD FILES TO CABINET</button>
  </div>
</div>

<!-- File viewer -->
<div id="file-viewer">
  <span id="viewer-close">[X]</span>
  <div id="viewer-content"></div>
  <div id="viewer-name"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
